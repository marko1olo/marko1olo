name: Refresh contribution trail

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    name: Generate profile SVGs
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Generate contribution paths
        uses: Platane/snk/svg-only@d8f6715049803e982ee5ff501b6b9b7d5deeb09b
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-contribution-snake-dark.svg?palette=github-dark&color_snake=%2322d3ee&color_dots=%230b1220,%230e3a52,%23155e75,%230e7490,%2322d3ee
            dist/github-contribution-snake-light.svg?palette=github-light&color_snake=%230891b2&color_dots=%23f8fafc,%23cffafe,%2367e8f9,%2322d3ee,%230891b2

      - name: Publish contribution paths
        uses: crazy-max/ghaction-github-pages@df5cc2bfa78282ded844b354faee141f06b41865
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
