<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1116 215" role="img" aria-labelledby="title description">
  <title id="title">Studio Beacon for Europe/Warsaw</title>
  <desc id="description">A time-of-day snapshot for the profile location, rendered by the scheduled GitHub workflow.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#07111f"/>
      <stop offset="100%" stop-color="#10243a"/>
    </linearGradient>
    <filter id="glow" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="1116" height="215" rx="22" fill="url(#background)"/>
  <rect x="1" y="1" width="1114" height="213" rx="21" fill="none" stroke="#24425b"/>
  <g font-family="DejaVu Sans, sans-serif">
    <text x="54" y="48" fill="#a5f3fc" font-size="13" font-weight="700" letter-spacing="2.4">STUDIO BEACON</text>
    <text x="54" y="79" fill="#f8fafc" font-size="25" font-weight="700">Sat · 05:57 in Warsaw</text>
    <text x="1060" y="48" fill="#a78bfa" font-size="13" font-weight="700" text-anchor="end">NIGHT WATCH</text>
    <text x="1060" y="72" fill="#7898a7" font-size="11" text-anchor="end">Workflow snapshot · 2026-08-22 03:57:37 UTC</text>
    <g transform="translate(54 109)">
      <rect width="224" height="68" rx="15" fill="#102b36" stroke="#a78bfa" stroke-width="2"/>
      <circle cx="28" cy="34" r="7" fill="#a78bfa" filter="url(#glow)"/>
      <text x="48" y="30" fill="#f8fafc" font-size="13" font-weight="700" letter-spacing="1.2">NIGHT WATCH</text>
      <text x="48" y="50" fill="#7296a6" font-size="12">22–05 local time</text>
      <text x="198" y="50" fill="#a78bfa" font-size="12" text-anchor="end">NOW</text>
    </g>
    <g transform="translate(306 109)">
      <rect width="224" height="68" rx="15" fill="#0a1b2a" stroke="#1f4054" stroke-width="1"/>
      <circle cx="28" cy="34" r="7" fill="#facc15" fill-opacity="0.55"/>
      <text x="48" y="30" fill="#9ab6c2" font-size="13" font-weight="700" letter-spacing="1.2">MORNING BUILD</text>
      <text x="48" y="50" fill="#7296a6" font-size="12">06–11 local time</text>
      
    </g>
    <g transform="translate(558 109)">
      <rect width="224" height="68" rx="15" fill="#0a1b2a" stroke="#1f4054" stroke-width="1"/>
      <circle cx="28" cy="34" r="7" fill="#22d3ee" fill-opacity="0.55"/>
      <text x="48" y="30" fill="#9ab6c2" font-size="13" font-weight="700" letter-spacing="1.2">DAY SHIFT</text>
      <text x="48" y="50" fill="#7296a6" font-size="12">12–17 local time</text>
      
    </g>
    <g transform="translate(810 109)">
      <rect width="224" height="68" rx="15" fill="#0a1b2a" stroke="#1f4054" stroke-width="1"/>
      <circle cx="28" cy="34" r="7" fill="#fb923c" fill-opacity="0.55"/>
      <text x="48" y="30" fill="#9ab6c2" font-size="13" font-weight="700" letter-spacing="1.2">EVENING DEPLOY</text>
      <text x="48" y="50" fill="#7296a6" font-size="12">18–21 local time</text>
      
    </g>
  </g>
